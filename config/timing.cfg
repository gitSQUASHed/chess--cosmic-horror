; Attack timing per phase. Read at the start of every run (R restarts and re-reads it).
; Each value moves in a straight line from its start value to its end value over
; <name>_ramp_seconds, counted from the start of the phase, and then stays there.
;
; cooldown   Seconds a hand waits after finishing an action before its next one.
;            Starts at cooldown_max and shrinks to cooldown_min.
; telegraph  Seconds between the warning (hand on the field, shadow, marked tiles) and the
;            attack. Starts at telegraph_max and shrinks to telegraph_min. The design keeps it
;            fixed at 1 s.
; speed      Multiplier on how fast attacks move, fall, strike and recover (not the telegraph).
;            Starts at speed_min and grows to speed_max.

[phase1]
cooldown_max=4.2
cooldown_min=1.5
cooldown_ramp_seconds=120
telegraph_max=1.0
telegraph_min=1.0
telegraph_ramp_seconds=120
speed_min=0.6
speed_max=1.4
speed_ramp_seconds=120

[phase2]
cooldown_max=4.2
cooldown_min=0.0
cooldown_ramp_seconds=360
telegraph_max=1.0
telegraph_min=1.0
telegraph_ramp_seconds=450
; Phase 2 hands start twice as fast as Phase 1's base speed.
speed_min=2.0
speed_max=3.0
speed_ramp_seconds=450
