; When hand actions appear, in seconds since the phase started. Read at the start of every run
; (R restarts and re-reads it). <attack>_from: first time it is requested. <attack>_upgrade_at:
; from then on it uses its level-2 form. A negative value means never. Lists add one hand per
; entry once its time is reached. config/attacks.cfg can still switch an attack off entirely.

[phase1]
hands_at=[0, 30, 90]
sweep_from=0
sweep_upgrade_at=60
punch_from=0
punch_upgrade_at=60

[phase2]
; Attack hands, not counting guiding hands.
hands_at=[0, 0, 30, 90, 120, 150, 180]
guiding_hands_at=[60, 180]
swipe_from=0
swipe_upgrade_at=0
punch_from=0
punch_upgrade_at=0
void_removal_from=60
void_removal_upgrade_at=120
smash_from=60
smash_upgrade_at=120
